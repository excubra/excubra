# Release pipeline (ADR-0006): the only place where release signatures are made.
# Secret: RELEASE_KEY_PEM — the ECDSA P-256 private key (PEM). Its public half is
# committed as internal/sig/release.pub and compiled into every binary; a box only
# installs what verifies against it. The key never touches a server.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build console
        run: make web
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -mod=readonly \
              -ldflags "-s -w -X github.com/excubra/excubra/internal/version.Version=$VERSION -X github.com/excubra/excubra/internal/version.Commit=${GITHUB_SHA::7} -X github.com/excubra/excubra/internal/version.Date=$DATE" \
              -o dist/excubra_linux_$arch ./cmd/excubra
          done
          (cd dist && sha256sum excubra_linux_* > SHA256SUMS)

      - name: sign
        env:
          RELEASE_KEY_PEM: ${{ secrets.RELEASE_KEY_PEM }}
        run: |
          test -n "$RELEASE_KEY_PEM" || { echo "secret RELEASE_KEY_PEM is missing"; exit 1; }
          umask 077
          printf '%s\n' "$RELEASE_KEY_PEM" > "$RUNNER_TEMP/release-key.pem"
          for f in dist/excubra_linux_amd64 dist/excubra_linux_arm64 dist/SHA256SUMS; do
            openssl dgst -sha256 -sign "$RUNNER_TEMP/release-key.pem" -out "$f.der" "$f"
            base64 -w0 "$f.der" > "$f.sig"
            rm "$f.der"
          done
          rm "$RUNNER_TEMP/release-key.pem"

      - name: verify against the committed public key
        run: |
          for f in dist/excubra_linux_amd64 dist/excubra_linux_arm64 dist/SHA256SUMS; do
            base64 -d "$f.sig" > "$RUNNER_TEMP/sig.der"
            openssl dgst -sha256 -verify internal/sig/release.pub -signature "$RUNNER_TEMP/sig.der" "$f"
          done
          go run ./tools/sigcheck dist/excubra_linux_amd64 dist/excubra_linux_amd64.sig

      - name: manifest
        run: |
          go run ./tools/manifest -dir dist -version "${GITHUB_REF_NAME#v}" \
            -base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" > dist/manifest.json
          cat dist/manifest.json

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes dist/*
