{{define "content"}}
<section class="login-card">
  <div class="brand"><span class="mark">EX<b>0</b></span><span class="sub">Konsole</span></div>
  {{with .Data}}{{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}{{end}}
  <form method="post" action="/login" autocomplete="off">
    <label class="field"><span>Benutzer</span><input name="user" required autofocus autocomplete="username"></label>
    <label class="field"><span>Passwort</span><input name="password" type="password" required autocomplete="current-password"></label>
    <label class="field"><span>TOTP-Code</span><input name="totp" inputmode="numeric" pattern="[0-9]{6}" required autocomplete="one-time-code" placeholder="6 Ziffern"></label>
    <button>Anmelden</button>
  </form>
  <p class="hint">Konten legt der Betreiber auf dem Server an: <code>excubra server user add &lt;name&gt;</code></p>
</section>
{{end}}
