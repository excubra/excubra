{{define "content"}}
{{with .Data}}
<div class="topbar" style="padding:0"><div><h1>Audit-Log</h1></div></div>
<div class="card tight" style="margin-top:16px">
{{if .Entries}}<table><thead><tr><th>Zeit</th><th>Wer</th><th>Aktion</th><th>Ziel</th><th>Details</th></tr></thead><tbody>
{{range .Entries}}<tr><td class="muted" style="white-space:nowrap">{{ts .At}}</td><td>{{.Actor}}</td><td><code>{{.Action}}</code></td><td><code>{{.Target}}</code></td><td class="muted">{{.Summary}}</td></tr>{{end}}
</tbody></table>{{else}}<div class="empty"><svg class="i"><use href="/static/icons.svg#list"/></svg><b>Noch nichts protokolliert</b></div>{{end}}
</div>
{{if .Next}}<a class="btn ghost small" href="/audit?before={{.Next}}">Ältere Einträge</a>{{end}}
{{end}}
{{end}}
