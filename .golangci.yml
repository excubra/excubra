version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
    - bodyclose
    - noctx
  settings:
    gosec:
      excludes:
        - G304 # file paths come from our own config, not from requests
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022"] # ST1005: user-facing German messages are capitalized
    misspell:
      ignore-rules: [konfiguration]
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, errcheck, unparam]

formatters:
  enable:
    - gofmt
    - goimports
